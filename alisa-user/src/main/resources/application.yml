server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: user-service
  config:
    import: optional:file:./alisa-user/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls.enable: ${MAIL_STARTTLS:true}
          ssl.enable: ${MAIL_SSL:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
mybatis:
  mapper-locations: classpath:mapper/*.xml
jwt:
  secret: ${JWT_SECRET}
alisa:
  tenancy:
    enabled: ${TENANCY_ENABLED:false}
  oauth:
    enabled: ${OAUTH_ENABLED:false}
    issuer: ${OAUTH_ISSUER:}
    allow-loopback-redirects: ${OAUTH_ALLOW_LOOPBACK:false}
  authorization:
    enabled: ${AUTHORIZATION_ENABLED:false}
  user:
    application-name: ${USER_APPLICATION_NAME:Alisa}
    reset-key-prefix: ${USER_RESET_KEY_PREFIX:alisa:user:reset:}
    reset-code-ttl: ${USER_RESET_CODE_TTL:5m}
    reset-send-interval: ${USER_RESET_SEND_INTERVAL:60s}
  notification:
    mail:
      from: ${MAIL_FROM:${MAIL_USERNAME:}}
