map $uri $admin_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $admin_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://alisa-admin-api:8084;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host alisa.vip.cpolar.cn;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host alisa.vip.cpolar.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /admin;
    }
    location = /auth { return 302 /admin/auth/login; }
    location /auth/ {
        proxy_pass http://alisa-admin-api:8084/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host alisa.vip.cpolar.cn;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host alisa.vip.cpolar.cn;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /admin/auth;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
