# Argo CD PreSync hooks: build and publish before updating the gateway.
apiVersion: batch/v1
kind: Job
metadata:
  name: alisa-gateway-build
  namespace: alisa-infra
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-20"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
        - name: source
          image: alpine/git:2.47.2
          command: [sh, -ec]
          args:
            - |
              git clone --depth=1 --branch codex/alisa-infra-argocd https://github.com/future-alisa/alisa-cloud.git /workspace/source
              cd /workspace/source
              git fetch --depth=1 origin "$SOURCE_REVISION"
              git checkout --detach "$SOURCE_REVISION"
          env:
            - name: SOURCE_REVISION
              value: fc3cf8b23eadd70b6659fbe2d92dde15bce175e4
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        - name: package
          image: maven:3.9.9-eclipse-temurin-17
          workingDir: /workspace/source
          command: [mvn]
          args: ["-B", "-pl", "alisa-gateway", "-am", "package"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: maven-cache
              mountPath: /root/.m2
      containers:
        - name: publish-image
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --context=dir:///workspace/source
            - --dockerfile=docker/alisa-gateway.Dockerfile
            - --destination=alisa-registry.cpolar.top/alisa-gateway:nacos-fc3cf8b23ead
            - --push-retry=3
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: registry
              mountPath: /kaniko/.docker
              readOnly: true
      volumes:
        - name: workspace
          emptyDir: {}
        - name: maven-cache
          emptyDir: {}
        - name: registry
          secret:
            secretName: alisa-registry
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: alisa-gateway-nacos-bootstrap
  namespace: alisa-infra
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: alisa-registry
      containers:
        - name: publish-routes
          image: alisa-registry.cpolar.top/alisa-gateway:nacos-fc3cf8b23ead
          command: [java]
          args:
            - -Dloader.main=com.alisa.routes.NacosRoutePublisher
            - -cp
            - /app/alisa-gateway.jar
            - org.springframework.boot.loader.PropertiesLauncher
            - /app/nacos-routes.yaml
          envFrom:
            - configMapRef:
                name: alisa-nacos
