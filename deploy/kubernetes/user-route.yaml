apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alisa-user-route
  namespace: alisa
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - alisa.docker.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/user
        - path:
            type: PathPrefix
            value: /api/v1/authorization
      backendRefs:
        - name: alisa-user
          port: 8080
