apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alisa-gateway
  namespace: alisa-infra
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - alisa.vip.cpolar.cn
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /alisa-gateway
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: alisa-gateway
          port: 8100
