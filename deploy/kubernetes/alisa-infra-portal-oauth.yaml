# OAuth stays disabled until database backup, schema checks and administrator selection.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alisa-portal-oauth-config
  namespace: alisa-infra
data:
  portal-oauth.yaml: |
    # OAuth and authorization remain OFF until schemas and administrator are verified.
    server:
      forward-headers-strategy: framework
      servlet:
        session:
          cookie:
            path: /auth
            secure: true
            http-only: true
            same-site: lax
    alisa:
      oauth:
        enabled: ${OAUTH_ENABLED:false}
        issuer: ${OAUTH_ISSUER:https://alisa.vip.cpolar.cn/auth}
        applications:
          portal:
            "[portal:console:manage]": 管理整个门户实例
      authorization:
        enabled: ${AUTHORIZATION_ENABLED:false}
        applications:
          portal: ${PORTAL_AUTHORIZATION_PROVIDER:local}
        administrators: ${AUTHORIZATION_ADMINISTRATORS:},${PORTAL_BOOTSTRAP_ADMINISTRATOR:}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alisa-portal-oauth
  namespace: alisa-infra
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - alisa.vip.cpolar.cn
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth/oauth2
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /oauth2
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
  - matches:
    - path:
        type: PathPrefix
        value: /auth/oauth
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /oauth
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
  - matches:
    - path:
        type: PathPrefix
        value: /auth/login
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /login
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
  - matches:
    - path:
        type: PathPrefix
        value: /auth/logout
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /logout
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
  - matches:
    - path:
        type: PathPrefix
        value: /auth/.well-known
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /.well-known
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
  - matches:
    - path:
        type: PathPrefix
        value: /auth/api/v1/authorization/check
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /api/v1/authorization/check
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - Forwarded
        - X-Forwarded-Ssl
        set:
        - name: X-Forwarded-Prefix
          value: /auth
        - name: X-Forwarded-Proto
          value: https
        - name: X-Forwarded-Host
          value: alisa.vip.cpolar.cn
        - name: X-Forwarded-Port
          value: '443'
    backendRefs:
    - name: alisa-user
      port: 8084
