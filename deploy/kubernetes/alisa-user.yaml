apiVersion: apps/v1
kind: Deployment
metadata:
  name: alisa-user
  namespace: alisa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alisa-user
  template:
    metadata:
      labels:
        app: alisa-user
    spec:
      containers:
        - name: alisa-user
          image: ghcr.io/sunyuboalisa/alisa-user:latest
          ports:
            - containerPort: 8084
          envFrom:
            - secretRef:
                name: alisa-user-env
          env:
            - name: SERVER_PORT
              value: "8084"
          readinessProbe:
            httpGet:
              path: /api/v1/user/health
              port: 8084
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/user/health
              port: 8084
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: alisa-user
  namespace: alisa
spec:
  selector:
    app: alisa-user
  ports:
    - port: 8080
      targetPort: 8084
