server:
  port: ${SERVER_PORT:8100}
spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:./alisa-gateway/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
        add-to-simple-url-handler-mapping: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**,/api/v1/authorization/**,/oauth2/**,/oauth/**,/login,/logout,/.well-known/**
jwt:
  secret: ${JWT_SECRET}

alisa:
  gateway:
    routes:
      nacos:
        enabled: ${GATEWAY_NACOS_ROUTES_ENABLED:false}
        data-id: ${GATEWAY_NACOS_ROUTES_DATA_ID:alisa-gateway-routes.yaml}
        group: ${GATEWAY_NACOS_ROUTES_GROUP:ALISA_GATEWAY}
